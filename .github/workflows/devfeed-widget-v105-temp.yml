name: DevFeed v1.0.5 Android Widget APK

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-widget-apk:
    if: github.head_ref == 'devfeed-widget'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout widget branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore DevFeed source and mobile fixes
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf devfeed-build/src
          mkdir -p devfeed-build/src
          cat devfeed-build/source.part-* > devfeed-build/devfeed-apk-source.b64
          test "$(wc -c < devfeed-build/devfeed-apk-source.b64)" -eq 25776
          echo "eee78698b94ca85a8ba25ecc0bbf7a164265cd686861cc0acfcb92aeb58df086  devfeed-build/devfeed-apk-source.b64" | sha256sum -c -
          base64 -d devfeed-build/devfeed-apk-source.b64 > devfeed-build/devfeed-apk-source.zip
          unzip -tq devfeed-build/devfeed-apk-source.zip
          unzip -q devfeed-build/devfeed-apk-source.zip -d devfeed-build/src
          cp devfeed-build/override-client.ts devfeed-build/src/mobile/src/api/client.ts
          cp devfeed-build/override-app.json devfeed-build/src/mobile/app.json
          cp devfeed-build/override-root-layout.tsx devfeed-build/src/mobile/app/_layout.tsx
          cp devfeed-build/override-tabs-layout.tsx 'devfeed-build/src/mobile/app/(tabs)/_layout.tsx'

      - name: Install dependencies
        working-directory: devfeed-build/src/mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: devfeed-build/src/mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: devfeed-build/src/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Install native Android home widget
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID='devfeed-build/src/mobile/android/app/src/main'
          JAVA_DIR="$ANDROID/java/app/devfeed/mobile"
          mkdir -p "$JAVA_DIR" "$ANDROID/res/layout" "$ANDROID/res/drawable" "$ANDROID/res/xml"
          cp devfeed-build/widget-native/DevFeedWidgetProvider.java "$JAVA_DIR/DevFeedWidgetProvider.java"
          cp devfeed-build/widget-native/devfeed_widget.xml "$ANDROID/res/layout/devfeed_widget.xml"
          cp devfeed-build/widget-native/devfeed_widget_bg.xml "$ANDROID/res/drawable/devfeed_widget_bg.xml"
          cp devfeed-build/widget-native/devfeed_widget_info.xml "$ANDROID/res/xml/devfeed_widget_info.xml"
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('devfeed-build/src/mobile/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          receiver = '''
              <receiver
                  android:name=".DevFeedWidgetProvider"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/devfeed_widget_info" />
              </receiver>
          '''
          if 'DevFeedWidgetProvider' not in text:
              if '</application>' not in text:
                  raise SystemExit('application closing tag not found')
              text = text.replace('</application>', receiver + '\n  </application>')
              manifest.write_text(text, encoding='utf-8')
          PY
          grep -n 'DevFeedWidgetProvider\|APPWIDGET_UPDATE\|devfeed_widget_info' "$ANDROID/AndroidManifest.xml"

      - name: Build standalone release APK with widget
        working-directory: devfeed-build/src/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK='devfeed-build/src/mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
          mkdir -p devfeed-build/output
          cp "$APK" devfeed-build/output/DevFeed-v1.0.5-widget-release.apk
          sha256sum devfeed-build/output/DevFeed-v1.0.5-widget-release.apk
          ls -lh devfeed-build/output/DevFeed-v1.0.5-widget-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevFeed-v1.0.5-Widget-Release-APK
          path: devfeed-build/output/DevFeed-v1.0.5-widget-release.apk
          if-no-files-found: error
          retention-days: 7
