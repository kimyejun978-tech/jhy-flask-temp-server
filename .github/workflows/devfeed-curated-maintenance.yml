name: DevFeed curated event maintenance

on:
  push:
    branches: [devfeed-runtime]
    paths:
      - '.github/workflows/devfeed-curated-maintenance.yml'
      - 'devfeed-pending-events.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devfeed-curated-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devfeed-runtime
          fetch-depth: 0

      - name: Merge pending events and clean expired items
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          from pathlib import Path

          curated_path = Path('devfeed-curated-events.json')
          pending_path = Path('devfeed-pending-events.json')

          data = json.loads(curated_path.read_text(encoding='utf-8'))
          pending = {'events': []}
          if pending_path.exists():
              pending = json.loads(pending_path.read_text(encoding='utf-8'))

          kst = ZoneInfo('Asia/Seoul')
          now = datetime.now(kst)

          def parse_iso(value, date_only_end_of_day=False):
              if not value:
                  return None
              try:
                  if len(value) == 10:
                      d = datetime.fromisoformat(value).date()
                      t = time(23, 59, 59) if date_only_end_of_day else time(0, 0, 0)
                      return datetime.combine(d, t, tzinfo=kst)
                  dt = datetime.fromisoformat(value.replace('Z', '+00:00'))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=kst)
                  return dt.astimezone(kst)
              except Exception:
                  return None

          def key(e):
              return (e.get('title'), e.get('sourceUrl'))

          events = list(data.get('events', []))
          index = {key(e): i for i, e in enumerate(events)}
          for event in pending.get('events', []):
              k = key(event)
              if k in index:
                  events[index[k]] = event
              else:
                  index[k] = len(events)
                  events.append(event)

          active = []
          for e in events:
              deadline = parse_iso(e.get('deadline'), date_only_end_of_day=True)
              if deadline and deadline < now:
                  continue

              if not e.get('deadline') and e.get('datePrecision') == 'EXACT':
                  end_value = e.get('endDate')
                  start_value = e.get('startDate')

                  if end_value:
                      end_at = parse_iso(end_value, date_only_end_of_day=True)
                      if end_at and end_at < now:
                          continue
                  elif start_value:
                      if len(start_value) >= 10:
                          try:
                              event_day = datetime.fromisoformat(start_value[:10]).date()
                              if event_day < now.date():
                                  continue
                          except Exception:
                              pass

              active.append(e)

          data['events'] = active
          data['updatedAt'] = now.isoformat(timespec='seconds')
          curated_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          pending_path.write_text(json.dumps({'events': []}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

      - name: Commit synchronized feed
        shell: bash
        run: |
          git config user.name 'DevFeed Bot'
          git config user.email 'actions@github.com'
          git add devfeed-curated-events.json devfeed-pending-events.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: sync curated events'
            git pull --rebase origin devfeed-runtime
            git push origin HEAD:devfeed-runtime
          fi

