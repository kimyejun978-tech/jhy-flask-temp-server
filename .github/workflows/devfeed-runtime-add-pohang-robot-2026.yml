name: DevFeed runtime add Pohang robot event

on:
  push:
    branches: [devfeed-runtime]
    paths:
      - '.github/workflows/devfeed-runtime-add-pohang-robot-2026.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devfeed-runtime
      - name: Clean expired events and add Pohang robot event
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, time, timezone, timedelta
          from pathlib import Path

          KST = timezone(timedelta(hours=9))
          now = datetime.fromisoformat('2026-08-26T05:36:20+09:00')
          path = Path('devfeed-curated-events.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          def parse_expiry(value, end_of_day_for_date=False):
              if not value:
                  return None
              if len(value) == 10:
                  d = datetime.fromisoformat(value).date()
                  return datetime.combine(d, time(23,59,59), tzinfo=KST)
              dt = datetime.fromisoformat(value)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=KST)
              if end_of_day_for_date:
                  d = dt.astimezone(KST).date()
                  return datetime.combine(d, time(23,59,59), tzinfo=KST)
              return dt

          active = []
          for e in data.get('events', []):
              expired = False
              deadline = parse_expiry(e.get('deadline'))
              if deadline is not None and deadline < now:
                  expired = True
              elif deadline is None and e.get('datePrecision') == 'EXACT':
                  if e.get('endDate'):
                      end_at = parse_expiry(e.get('endDate'))
                      if end_at is not None and end_at < now:
                          expired = True
                  elif e.get('startDate'):
                      end_at = parse_expiry(e.get('startDate'), end_of_day_for_date=True)
                      if end_at is not None and end_at < now:
                          expired = True
              if not expired:
                  active.append(e)

          item = {
            'title': '제26회 한국지능로봇경진대회 & 제22회 포항가족과학축제',
            'categories': ['로봇','AI','과학체험','전시·시연','경진대회'],
            'startDate': '2026-09-05',
            'endDate': '2026-09-06',
            'dateText': '2026년 9월 5일 ~ 9월 6일',
            'datePrecision': 'EXACT',
            'deadline': None,
            'location': '경북 포항종합운동장 만인당 실내체육관',
            'isOnline': False,
            'fee': None,
            'highSchoolAllowed': None,
            'importance': 'HIGH',
            'summary': '한국로봇융합연구원이 주관하는 한국지능로봇경진대회와 포항가족과학축제가 동시 개최된다. 지능로봇·퍼포먼스로봇 본선팀 전시·시연과 로봇 마라톤, AI 활용 퀴즈 등 과학체험 프로그램을 현장에서 볼 수 있다.',
            'sourceUrl': 'https://www.kiro.re.kr/cul/cintro2.asp'
          }

          replaced = False
          for i, e in enumerate(active):
              if e.get('title') == item['title'] and e.get('sourceUrl') == item['sourceUrl']:
                  active[i] = item
                  replaced = True
                  break
          if not replaced:
              active.append(item)

          data['events'] = active
          data['updatedAt'] = '2026-08-26T05:36:20+09:00'
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add devfeed-curated-events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: add Pohang robot contest and science festival'
          git push origin HEAD:devfeed-runtime
