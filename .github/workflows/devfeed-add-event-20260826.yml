name: DevFeed Curated Event Sync 2026-08-26

on:
  push:
    branches: [devfeed-runtime]
    paths:
      - .github/workflows/devfeed-add-event-20260826.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devfeed-runtime
      - name: Update curated events
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          p = Path('devfeed-curated-events.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          KST = timezone(timedelta(hours=9))
          now = datetime(2026, 8, 26, 10, 53, tzinfo=KST)

          def parse(v, end_of_day=False):
              if not v:
                  return None
              if len(v) == 10:
                  d = datetime.fromisoformat(v).replace(tzinfo=KST)
                  return d.replace(hour=23, minute=59, second=59) if end_of_day else d
              return datetime.fromisoformat(v)

          active=[]
          for e in data.get('events', []):
              deadline=e.get('deadline')
              if deadline:
                  dt=parse(deadline, end_of_day=(len(deadline)==10))
                  if dt and dt < now:
                      continue
              elif e.get('datePrecision') == 'EXACT':
                  end=e.get('endDate') or e.get('startDate')
                  if end:
                      dt=parse(end, end_of_day=(len(end)==10 or not e.get('endDate')))
                      if dt and dt < now:
                          continue
              active.append(e)

          event = {
            'title':'2026 경기 SW미래채움 AI 페스티벌',
            'categories':['AI','SW','로봇','피지컬 AI','코딩','체험행사'],
            'startDate':'2026-09-05T10:00:00+09:00',
            'endDate':'2026-09-05T17:00:00+09:00',
            'dateText':'2026년 9월 5일 10:00~17:00',
            'datePrecision':'EXACT',
            'deadline':'2026-09-03T18:00:00+09:00',
            'location':'경기 수원 · 경기도경제과학진흥원 광교홀 및 1층 로비',
            'isOnline':False,
            'fee':None,
            'highSchoolAllowed':True,
            'importance':'HIGH',
            'summary':'초·중·고등학생과 AI·SW에 관심 있는 누구나 참여할 수 있는 체험형 페스티벌. 대학·기관의 AI·SW 콘텐츠, 휴머노이드 복싱 로봇쇼, 로봇팔·MechDog, 코딩로봇, VR·메타버스, 피지컬컴퓨팅 등을 직접 체험할 수 있다.',
            'sourceUrl':'https://ggswfesta.kr/'
          }
          key=(event['title'],event['sourceUrl'])
          found=False
          for i,e in enumerate(active):
              if (e.get('title'),e.get('sourceUrl')) == key:
                  active[i]=event; found=True; break
          if not found:
              active.append(event)
          data['events']=active
          data['updatedAt']='2026-08-26T10:53:00+09:00'
          p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Commit curated feed
        shell: bash
        run: |
          git config user.name 'devfeed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add devfeed-curated-events.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add 2026 경기 SW미래채움 AI 페스티벌'
          git push origin HEAD:devfeed-runtime
