name: DevFeed Release APK Temporary Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release-apk:
    if: github.head_ref == 'devfeed-live-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified DevFeed source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf devfeed-build/src
          mkdir -p devfeed-build/src
          cat devfeed-build/source.part-* > devfeed-build/devfeed-apk-source.b64
          test "$(wc -c < devfeed-build/devfeed-apk-source.b64)" -eq 25776
          echo "eee78698b94ca85a8ba25ecc0bbf7a164265cd686861cc0acfcb92aeb58df086  devfeed-build/devfeed-apk-source.b64" | sha256sum -c -
          base64 -d devfeed-build/devfeed-apk-source.b64 > devfeed-build/devfeed-apk-source.zip
          unzip -tq devfeed-build/devfeed-apk-source.zip
          unzip -q devfeed-build/devfeed-apk-source.zip -d devfeed-build/src
          cp devfeed-build/override-client.ts devfeed-build/src/mobile/src/api/client.ts
          cp devfeed-build/override-app.json devfeed-build/src/mobile/app.json

      - name: Install dependencies
        working-directory: devfeed-build/src/mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: devfeed-build/src/mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: devfeed-build/src/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        working-directory: devfeed-build/src/mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify bundled release APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=devfeed-build/src/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          mkdir -p devfeed-build/output
          cp "$APK" devfeed-build/output/DevFeed-v1.0.3-release.apk
          ls -lh devfeed-build/output/DevFeed-v1.0.3-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevFeed-Release-APK
          path: devfeed-build/output/DevFeed-v1.0.3-release.apk
          if-no-files-found: error
          retention-days: 7
