name: DevFeed curate once

on:
  push:
    branches: [devfeed-runtime]

permissions:
  contents: write

jobs:
  curate:
    if: contains(github.event.head_commit.message, '[curate-events]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devfeed-runtime
      - name: Update curated events
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          p = Path('devfeed-curated-events.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          events = data.get('events', [])

          # Add or update the newly verified event.
          new_event = {
            'title': '2026 뉴스 빅데이터 해커톤',
            'categories': ['생성형 AI', '뉴스데이터', '빅데이터', '해커톤', '팩트체크'],
            'startDate': None,
            'endDate': None,
            'dateText': '접수 2026년 8월 24일~9월 17일 · 본선 심사 11월 3일',
            'datePrecision': 'APPROXIMATE_RANGE',
            'deadline': '2026-09-17',
            'location': None,
            'isOnline': None,
            'fee': None,
            'highSchoolAllowed': True,
            'importance': 'HIGH',
            'summary': '만 15~34세 청년 2~5인 팀이 빅카인즈 API와 생성형 AI를 활용해 뉴스데이터 기반 서비스 또는 허위정보 탐지·검증 아이디어를 개발하는 해커톤. 본선 14팀을 선발하며 대상은 문화체육관광부 장관상과 상금 600만 원.',
            'sourceUrl': 'https://akj.or.kr/article/?cate=22&id=4448'
          }
          replaced = False
          for i, e in enumerate(events):
            if e.get('title') == new_event['title'] or e.get('sourceUrl') == new_event['sourceUrl']:
              events[i] = new_event
              replaced = True
              break
          if not replaced:
            events.append(new_event)

          data['events'] = events
          data['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          rm -f .github/workflows/devfeed-curate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add devfeed-curated-events.json .github/workflows/devfeed-curate-once.yml
          git commit -m 'chore: update DevFeed curated events' || exit 0
          git push origin HEAD:devfeed-runtime
